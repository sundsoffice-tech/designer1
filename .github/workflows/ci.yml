name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ss-messebau-configurator

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint frontend
        run: pnpm --filter @ss/frontend lint

      - name: Type check frontend
        run: pnpm --filter @ss/frontend typecheck

      - name: Run unit and integration tests
        run: pnpm --filter @ss/frontend test:unit -- --runInBand

      - name: Install Playwright browsers
        run: pnpm --filter @ss/frontend exec playwright install --with-deps

      - name: Run Playwright end-to-end tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: pnpm --filter @ss/frontend test:e2e

      - name: Build frontend
        run: pnpm --filter @ss/frontend build

  deploy-vercel:
    needs: test-and-build
    if: >-
      github.ref == 'refs/heads/main' &&
      secrets.VERCEL_TOKEN != '' &&
      secrets.VERCEL_PROJECT_ID != '' &&
      secrets.VERCEL_ORG_ID != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ss-messebau-configurator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @ss/frontend build

      - name: Deploy to Vercel
        uses: vercel/actions/deploy@v1
        with:
          working-directory: ss-messebau-configurator/apps/frontend
          prod: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
